<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="LanMap — карта и порядок в домашней сети">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1426"/>
      <stop offset="1" stop-color="#132a4f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <!-- сетка точек -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="700" cy="40" r="2"/><circle cx="760" cy="40" r="2"/><circle cx="820" cy="40" r="2"/><circle cx="880" cy="40" r="2"/><circle cx="940" cy="40" r="2"/><circle cx="1000" cy="40" r="2"/><circle cx="1060" cy="40" r="2"/><circle cx="1120" cy="40" r="2"/><circle cx="1180" cy="40" r="2"/><circle cx="1240" cy="40" r="2"/>
    <circle cx="700" cy="280" r="2"/><circle cx="760" cy="280" r="2"/><circle cx="820" cy="280" r="2"/><circle cx="880" cy="280" r="2"/><circle cx="940" cy="280" r="2"/><circle cx="1000" cy="280" r="2"/><circle cx="1060" cy="280" r="2"/><circle cx="1120" cy="280" r="2"/><circle cx="1180" cy="280" r="2"/><circle cx="1240" cy="280" r="2"/>
  </g>

  <!-- значок: радар над сетью -->
  <g transform="translate(170 160)">
    <circle r="150" fill="url(#glow)"/>
    <circle r="104" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2"/>
    <circle r="72" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2"/>
    <circle r="40" fill="none" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M0 0 L104 0 A104 104 0 0 0 73.5 -73.5 Z" fill="url(#sweep)"/>
    <g stroke="#7dd3fc" stroke-width="2.5" stroke-opacity="0.8">
      <line x1="0" y1="0" x2="62" y2="-38"/>
      <line x1="0" y1="0" x2="-70" y2="-30"/>
      <line x1="0" y1="0" x2="-30" y2="78"/>
      <line x1="0" y1="0" x2="80" y2="52"/>
      <line x1="62" y1="-38" x2="80" y2="52"/>
    </g>
    <circle r="15" fill="#3b82f6" stroke="#e0f2fe" stroke-width="3"/>
    <circle cx="62" cy="-38" r="10" fill="#22c55e" stroke="#0b1426" stroke-width="3"/>
    <circle cx="-70" cy="-30" r="10" fill="#22c55e" stroke="#0b1426" stroke-width="3"/>
    <circle cx="-30" cy="78" r="10" fill="#f59e0b" stroke="#0b1426" stroke-width="3"/>
    <circle cx="80" cy="52" r="10" fill="#22c55e" stroke="#0b1426" stroke-width="3"/>
    <circle cx="96" cy="-78" r="7" fill="#94a3b8" stroke="#0b1426" stroke-width="3"/>
  </g>

  <text x="360" y="148" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="88" font-weight="700" fill="#f8fafc" letter-spacing="-1">Lan<tspan fill="#38bdf8">Map</tspan></text>
  <text x="364" y="200" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#cbd5e1">Что за устройства в твоей сети — и как навести в ней порядок</text>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#e2e8f0">
    <rect x="364" y="232" width="176" height="40" rx="20" fill="#1e3a8a" fill-opacity="0.6" stroke="#3b82f6" stroke-opacity="0.6"/>
    <text x="452" y="258" text-anchor="middle">🔍 опознание</text>
    <rect x="552" y="232" width="200" height="40" rx="20" fill="#1e3a8a" fill-opacity="0.6" stroke="#3b82f6" stroke-opacity="0.6"/>
    <text x="652" y="258" text-anchor="middle">🛡 только чтение</text>
    <rect x="764" y="232" width="262" height="40" rx="20" fill="#1e3a8a" fill-opacity="0.6" stroke="#3b82f6" stroke-opacity="0.6"/>
    <text x="895" y="258" text-anchor="middle">🏠 данные остаются дома</text>
  </g>
</svg>
