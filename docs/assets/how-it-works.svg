<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-label="Как работает LanMap: срез, улики, опознание, отчёт, порядок">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1426"/>
      <stop offset="1" stop-color="#132a4f"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1280" height="470" rx="24" fill="url(#bg)"/>
  <text x="640" y="56" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">Как это работает</text>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <!-- 1 -->
    <g transform="translate(40 96)">
      <rect width="208" height="250" rx="18" fill="#0f1f3a" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="2"/>
      <circle cx="104" cy="62" r="36" fill="#1e3a8a"/>
      <circle cx="104" cy="62" r="22" fill="none" stroke="#7dd3fc" stroke-width="3"/>
      <circle cx="104" cy="62" r="9" fill="none" stroke="#7dd3fc" stroke-width="3"/>
      <line x1="104" y1="62" x2="124" y2="44" stroke="#7dd3fc" stroke-width="3"/>
      <text x="104" y="132" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc">1. Срез</text>
      <text x="104" y="164" text-anchor="middle" font-size="16" fill="#cbd5e1">ping, ARP, порты,</text>
      <text x="104" y="186" text-anchor="middle" font-size="16" fill="#cbd5e1">mDNS, SSDP, ONVIF,</text>
      <text x="104" y="208" text-anchor="middle" font-size="16" fill="#cbd5e1">роутер — за 1–2 мин</text>
    </g>
    <!-- 2 -->
    <g transform="translate(286 96)">
      <rect width="208" height="250" rx="18" fill="#0f1f3a" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="2"/>
      <circle cx="104" cy="62" r="36" fill="#1e3a8a"/>
      <circle cx="98" cy="56" r="15" fill="none" stroke="#7dd3fc" stroke-width="3.5"/>
      <line x1="109" y1="67" x2="122" y2="80" stroke="#7dd3fc" stroke-width="4.5" stroke-linecap="round"/>
      <text x="104" y="132" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc">2. Улики</text>
      <text x="104" y="164" text-anchor="middle" font-size="16" fill="#cbd5e1">что устройство</text>
      <text x="104" y="186" text-anchor="middle" font-size="16" fill="#cbd5e1">говорит о себе:</text>
      <text x="104" y="208" text-anchor="middle" font-size="16" fill="#cbd5e1">модель, прошивка</text>
    </g>
    <!-- 3 -->
    <g transform="translate(532 96)">
      <rect width="208" height="250" rx="18" fill="#0f1f3a" stroke="#38bdf8" stroke-width="2.5"/>
      <circle cx="104" cy="62" r="36" fill="#1e3a8a"/>
      <path d="M84 50 h22 l16 14 l-16 14 h-22 z" fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="92" cy="64" r="3.5" fill="#7dd3fc"/>
      <text x="104" y="132" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc">3. Опознание</text>
      <text x="104" y="164" text-anchor="middle" font-size="16" fill="#cbd5e1">правила отпечатков:</text>
      <text x="104" y="186" text-anchor="middle" font-size="16" fill="#cbd5e1">тип, производитель,</text>
      <text x="104" y="208" text-anchor="middle" font-size="16" fill="#cbd5e1">модель + уверенность</text>
    </g>
    <!-- 4 -->
    <g transform="translate(778 96)">
      <rect width="208" height="250" rx="18" fill="#0f1f3a" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="2"/>
      <circle cx="104" cy="62" r="36" fill="#1e3a8a"/>
      <rect x="84" y="44" width="40" height="36" rx="5" fill="none" stroke="#7dd3fc" stroke-width="3.5"/>
      <line x1="91" y1="55" x2="117" y2="55" stroke="#7dd3fc" stroke-width="3"/>
      <line x1="91" y1="64" x2="111" y2="64" stroke="#7dd3fc" stroke-width="3"/>
      <line x1="91" y1="72" x2="104" y2="72" stroke="#7dd3fc" stroke-width="3"/>
      <text x="104" y="132" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc">4. Отчёт</text>
      <text x="104" y="164" text-anchor="middle" font-size="16" fill="#cbd5e1">карточки с уликами,</text>
      <text x="104" y="186" text-anchor="middle" font-size="16" fill="#cbd5e1">кнопки «открыть</text>
      <text x="104" y="208" text-anchor="middle" font-size="16" fill="#cbd5e1">панель», «видео»…</text>
    </g>
    <!-- 5 -->
    <g transform="translate(1024 96)">
      <rect width="216" height="250" rx="18" fill="#0f1f3a" stroke="#22c55e" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="7 6"/>
      <circle cx="108" cy="62" r="36" fill="#14532d"/>
      <path d="M108 38 l20 8 v14 c0 14 -9 23 -20 28 c-11 -5 -20 -14 -20 -28 v-14 z" fill="none" stroke="#86efac" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M99 62 l7 7 l12 -13" fill="none" stroke="#86efac" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="108" y="132" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc">5. Порядок</text>
      <text x="108" y="164" text-anchor="middle" font-size="16" fill="#cbd5e1">находки → инструкция</text>
      <text x="108" y="186" text-anchor="middle" font-size="16" fill="#cbd5e1">→ «Проверить»</text>
      <text x="108" y="208" text-anchor="middle" font-size="16" fill="#86efac">скоро</text>
    </g>
    <g stroke="#38bdf8" stroke-width="3" marker-end="url(#arr)">
      <line x1="250" y1="221" x2="282" y2="221"/>
      <line x1="496" y1="221" x2="528" y2="221"/>
      <line x1="742" y1="221" x2="774" y2="221"/>
      <line x1="988" y1="221" x2="1020" y2="221"/>
    </g>

    <!-- лента принципов -->
    <rect x="40" y="378" width="1200" height="58" rx="14" fill="#0f1f3a" stroke="#334155"/>
    <text x="640" y="414" text-anchor="middle" font-size="18" fill="#e2e8f0">🛡 Ничего не меняет на устройствах   ·   🏠 Только своя сеть   ·   🔑 Пароли — в диспетчере Windows   ·   🧾 Каждый вывод с уликами</text>
  </g>
</svg>
